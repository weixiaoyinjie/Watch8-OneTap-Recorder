
name: Build Watch8 One-Tap Recorder APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          unzip -q -o Watch8_OneTap_Recorder_v1_1_Compact_GitHub_Actions_Source.zip
          test -f settings.gradle
          test -f app/build.gradle

      - name: Fix Notification Builder Java error
        shell: bash
        run: |
          SOURCE=app/src/main/java/com/watch8/onetaprecorder/RecordingService.java
          test -f "$SOURCE"
          sed -i '/\.setSilent(true)/d' "$SOURCE"
          if grep -Fq '.setSilent(true)' "$SOURCE"; then
            echo 'Java fix was not applied.'
            exit 1
          fi
          echo 'Java notification error fixed.'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8_OneTap_Recorder_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
